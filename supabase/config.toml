[functions.portal-document-extract]
# The browser enqueue branch verifies the user's bearer token in code. The
# scheduled worker branch is authenticated with the separate worker secret.
verify_jwt = false

[functions.public-assistant]
# Public endpoint; database access is service-role-only and it contains no
# caller-controlled table, source or document identifier.
verify_jwt = false

[functions.portal-self-register]
# Public "Enroll now" endpoint for students and agents. Writes go through the service-role-only
# portal_self_register function; callers are rate-limited by address and by email, and the password
# mail is sent through Supabase Auth.
verify_jwt = false

[functions.calendly-admin]
# CMS "Test connection" for the Calendly booking link. The gateway verifies the caller's JWT; the function then asks
# cms_integration_can_manage with that token before reading the saved Calendly token with the service role.
verify_jwt = true

[functions.public-assistant-index]
# Worker is authenticated with x-worker-secret, not a browser JWT.
verify_jwt = false

[functions.notification-delivery]
# Server-to-server only. verify_jwt = true (the gateway verifies the JWT signature; this must stay on) plus an in-function check on the verified
# token's claims: role must be service_role and, on a hosted project, ref must be this project's reference (401 without a token, 403 for anon/user
# tokens, another project's key or a malformed token). The key is not compared with SUPABASE_SERVICE_ROLE_KEY, which can hold the opaque sb_secret_ key. No worker secret. The /webhook route is disabled (410) until Postmark callbacks can be authenticated.
verify_jwt = true

[functions.email-sender]
# All queued emails except application_submitted, as branded HTML + text via Postmark (offer letter / CoE PDFs attached).
# Server-to-server only, called every minute by public.support_mail_dispatch(); verify_jwt stays on plus the service_role check.
verify_jwt = true

[functions.support-ticket-mail]
# Ticket emails (HTML + text) via Postmark. Server-to-server only, called every minute by public.support_mail_dispatch(); verify_jwt stays on
# plus the same in-function service_role check as notification-delivery.
verify_jwt = true

[functions.staff-register]
# Public staff application (no login is created): rate limit per caller and per email, CAPTCHA (EF_CAPTCHA_SECRET_KEY), resume
# type/size checks, then hr_svc_apply / hr_svc_apply_resume. All data access is service-role only inside the function.
verify_jwt = false

[functions.staff-onboarding]
# Staff onboarding by emailed link (no login): the link token is the credential and is re-checked by the database on every call
# (hr_svc_*, service role only). Personal details, documents (checked by content), reading, submit. no-store, no-referrer.
verify_jwt = false

[functions.staff-admin]
# Staff administration that needs email or several calls: document / re-upload link emails (token made here, only its hash
# stored; a failed send cancels that link), reject with the optional email, retry a failed email, drain the HR outbox.
# hr_admin_* run with the caller's JWT (hr.require_admin).
verify_jwt = true

[functions.xero-push]
# Xero Payroll AU push: TYPED STUB (OAuth2 placeholders only). Not activated, not scheduled, no secrets; every call answers 501.
# HR downloads the CSV from Staff > Xero Export instead. Activation is a separate owner decision (EF_XERO_* secrets).
verify_jwt = true

[functions.document-signing]
verify_jwt = true

[functions.holiday-sync]
# Victorian public holidays from data.gov.au (Nager.Date as fallback) into hr.public_holidays: the weekly pg_cron job (service-role
# key from Vault) and "Sync now" (admin JWT). The database decides who may run it (hr_holiday_sync_begin); never deletes a row.
verify_jwt = true

[functions.integrations-admin]
verify_jwt = true

[functions.integrations-webhook]
verify_jwt = false # Stripe HMAC signature verification in the handler; no user JWT exists on provider deliveries.

[functions.payments]
# Stripe Checkout for signing requests (the offer letter's initial deposit): link holders call with the anon key and their signing token.
verify_jwt = true

[functions.student-office365]
# CMS > Students > Office 365 email. The gateway verifies the caller's JWT; student_o365_* RPCs (admin_business_require) decide
# access. App-only Microsoft Graph with EF_MICROSOFT365_* secrets; the temporary password is never stored or returned.
verify_jwt = true

[functions.integrations-credentials]
# Stores access details for USI / VEVO / PRISMS / DataZoo ahead of their connectors (Vault, never returned). The gateway
# verifies the JWT; integration_can_manage and integration_module_access decide access, as in integrations-admin.
verify_jwt = true

[functions.portal-invite-activate]
# The "Activate access" link from an invitation email: the one-time token in the request body is the credential (checked by
# portal_invitation_link_confirm); it answers with a password-setup link for that invitation's email only.
verify_jwt = false

[functions.tga-course-import]
verify_jwt = true

[functions.admin-view-as]
# Switch view: signs an administrator in to the shared test account of the Student / Agent / Staff workspace. The gateway
# verifies the JWT; the function requires cms_is_admin and can only ever use the three fixed test accounts.
verify_jwt = true

[functions.intake-groups]
# INTAKE-GROUPS: an Admin / RTO Manager (intake_group_can_manage) syncs one intake's Microsoft 365 group, or the scheduled job
# (service role) syncs every group with work. App-only Microsoft Graph with the EF_MICROSOFT365_* secrets.
verify_jwt = true

[functions.lms-bulk-worker]
verify_jwt = true

[functions.usi-service]
# USI-SERVICE: USI Verify / Locate / Create from the application form (usi_access decides who may run what with the caller's JWT),
# and the service role's automatic re-checks (usi-reverify job). USI Web Services v5 with the EF_USI_* secrets (3PT until released).
verify_jwt = true

[functions.student-practice]
verify_jwt = true

[functions.student-application-invite]
verify_jwt = true

[functions.omara-discovery]
# OMARA-DISCOVERY: administrators (cms_is_admin with the caller's JWT) find a business's registered migration agents on the public OMARA
# register: Brave Search / Tavily (key in Integrations › Connections) finds public detail pages, then one plain GET per page, gently.
verify_jwt = true

[functions.letterhead-designer]
# LETTERHEAD-DESIGNER: administrators only (the gateway verifies the JWT; the function then checks cms_is_admin with the caller's token).
# Sends the brand inputs (details, colours, fonts; never the logo picture) to OpenAI (OPENAI_API_KEY, model EF_LETTERHEAD_MODEL).
verify_jwt = true

[functions.document-classify]
verify_jwt = true
