name: LMS build verification
on:
  pull_request:
    paths:
      - 'src/pages/admin/lms/**'
      - 'src/pages/admin/components/AdminMenu.tsx'
      - 'src/router/config.tsx'
      - '.github/workflows/lms-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364b683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run type-check
      - run: npm run build
