name: External integration audit
on:
  pull_request:
    paths:
      - 'src/**'
      - 'supabase/**'
      - 'scripts/check-external-integrations.mjs'
      - 'scripts/external-integrations-manifest.json'
      - '.github/workflows/external-integrations.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node scripts/check-external-integrations.mjs
