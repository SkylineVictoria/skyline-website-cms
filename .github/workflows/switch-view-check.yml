name: Switch View verification
on:
  push:
    branches: [work/admin-switch-view, main]
    paths:
      - 'src/**'
      - 'e2e/switch-view.spec.ts'
      - 'scripts/test-portal-application-access.ts'
      - '.github/workflows/switch-view-check.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run type-check
      - run: npm run test:portal-application-access
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/switch-view.spec.ts
