# Deploys Edge Functions to the approved project only, from main, exactly as committed (owner, 2026-11-20: deploy without a PC).
# Run it from GitHub › Actions › Deploy Edge Functions › Run workflow (or by Claude). Needs the repository secret
# SUPABASE_ACCESS_TOKEN (a Supabase personal access token). JWT verification follows supabase/config.toml; staff-register is
# public and always deployed with --no-verify-jwt, as it runs live.
name: Deploy Edge Functions

on:
  workflow_dispatch:
    inputs:
      functions:
        description: "Function names, separated by spaces"
        required: true
        default: "document-signing staff-admin staff-register"

permissions:
  contents: read

concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: xcpydisstlvtvcsqnjob
      FUNCTIONS: ${{ inputs.functions }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then echo "Add the SUPABASE_ACCESS_TOKEN repository secret first."; exit 1; fi
          for f in ${FUNCTIONS}; do
            if ! [[ "$f" =~ ^[a-z0-9-]+$ ]] || [ ! -f "supabase/functions/$f/index.ts" ]; then echo "Unknown function: $f"; exit 1; fi
            flags=""
            if [ "$f" = "staff-register" ]; then flags="--no-verify-jwt"; fi
            echo "::group::Deploy $f"
            supabase functions deploy "$f" --project-ref "${PROJECT_REF}" --use-api --yes ${flags}
            echo "::endgroup::"
          done
